[flake8]
max-line-length = 120
extend-ignore = E203, W503, F401, F841, W291, W293, E722, F541, E501
exclude = venv/,__pycache__/,*.pyc,*.pyo,*.pyd,*.egg-info/
per-file-ignores =
    __init__.py:F401

[mypy]
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
packages = app
ignore_errors = True

[isort]
profile = black
line_length = 120